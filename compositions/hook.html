  <div id="root" data-composition-id="hook" data-width="1920" data-height="1080" data-motion-blur="off">

      <div class="hook-win" id="hook-win-3"><video id="hook-v3" class="clip" src="assets/media/post3.mp4" data-start="0.9" data-duration="1.35" data-media-start="2.0" data-track-index="2" muted playsinline></video></div>
      <div class="hook-win" id="hook-win-4"><video id="hook-v4" class="clip" src="assets/media/three-sec.mp4" data-start="1.95" data-duration="1.35" data-media-start="1.8" data-track-index="3" muted playsinline></video></div>
      <div class="hook-win" id="hook-win-5"><video id="hook-v5" class="clip" src="assets/media/stop-scrolling.mp4" data-start="1.95" data-duration="1.35" data-media-start="1.0" data-track-index="2" muted playsinline></video></div>
      <div class="hook-win" id="hook-win-6"><video id="hook-v6" class="clip" src="assets/media/cutdowns.mp4" data-start="3.0" data-duration="1.2" data-media-start="3.4" data-track-index="3" muted playsinline></video></div>
      <div id="hook-knock" data-layout-ignore>
        <div class="hook-line w1"><span class="ch">H</span><span class="ch o" data-layout-ignore>O</span><span class="ch o" data-layout-ignore>O</span><span class="ch">K</span></div>

        <div class="hook-line w3"><span class="ch">M</span><span class="ch o" data-layout-ignore>O</span><span class="ch">T</span><span class="ch">I</span><span class="ch o" data-layout-ignore>O</span><span class="ch">N</span></div>
        <div class="hook-line w4"><span class="ch">S</span><span class="ch o" data-layout-ignore>O</span><span class="ch">U</span><span class="ch">N</span><span class="ch">D</span></div>

      <div class="hook-line w1"><span class="ch">H</span><span class="ch o" data-layout-ignore>O</span><span class="ch o" data-layout-ignore>O</span><span class="ch">K</span></div>
      <div class="hook-line w2"><span class="ch">S</span><span class="ch">T</span><span class="ch o" data-layout-ignore>O</span><span class="ch">R</span><span class="ch">Y</span></div>
      <div class="hook-line w3"><span class="ch">M</span><span class="ch o" data-layout-ignore>O</span><span class="ch">T</span><span class="ch">I</span><span class="ch o" data-layout-ignore>O</span><span class="ch">N</span></div>
      <div class="hook-line w4"><span class="ch">S</span><span class="ch o" data-layout-ignore>O</span><span class="ch">U</span><span class="ch">N</span><span class="ch">D</span></div>

  <script>
    (function () {
      const START = 0;
      const at = (fb) => Math.round(fb * 15.79016) / 30 - START; // film beat -> local seconds, frame-aligned
      const root = document.querySelector('[data-composition-id="hook"]');
      const $ = (s) => root.querySelector(s);
      const $$ = (s) => Array.from(root.querySelectorAll(s));
      const FONT = '900 410px "Inter"';
      const BASE = 691; // baseline y
      const DOT = 60;

      function kern(line) {
        // Restore pair kerning lost by splitting letters into inline-blocks.
        const c = document.createElement("canvas").getContext("2d");
        c.font = FONT;
        const chs = Array.from(line.querySelectorAll(".ch"));
        chs.forEach((el, i) => {
          if (i === chs.length - 1) return;
          const a = el.textContent, b = chs[i + 1].textContent;
          const k = c.measureText(a + b).width - c.measureText(a).width - c.measureText(b).width;
          el.style.marginRight = k.toFixed(2) + "px";
        });
      }

      function build() {
        $$(".hook-line").forEach(kern);
        const rootBox = root.getBoundingClientRect();
        const s = rootBox.width / 1920 || 1; // the Studio preview may scale the stage
        const rel = (el) => {
          const r = el.getBoundingClientRect();
          return { x: (r.left - rootBox.left) / s, y: (r.top - rootBox.top) / s, w: r.width / s, h: r.height / s };
        };
        // Place each video window under its O (ink layer is the layout truth).
        const oSpans = [
          $("#hook-ink .w1 .ch:nth-child(2)"), $("#hook-ink .w1 .ch:nth-child(3)"),
          $("#hook-ink .w2 .ch:nth-child(3)"),
          $("#hook-ink .w3 .ch:nth-child(2)"), $("#hook-ink .w3 .ch:nth-child(5)"),
          $("#hook-ink .w4 .ch:nth-child(2)"),
        ];
        oSpans.forEach((sp, i) => {
          const b = rel(sp);
          const win = $("#hook-win-" + (i + 1));
          win.style.left = b.x + "px";
          win.style.top = b.y + "px";
          win.style.width = b.w + "px";
          win.style.height = b.h + "px";
        });
        // Dot positions: after the last letter of each word, sitting on the baseline.
        const dotX = [1, 2, 3, 4].map((n) => {
          const last = $("#hook-ink .w" + n + " .ch:last-child");
          const b = rel(last);
          return b.x + b.w + 18;
        });

        const tl = gsap.timeline({ paused: true });
        const words = [1, 2, 3, 4].map((n) => $$(".w" + n + " .ch"));
        const byIndex = (n) => {
          // pair ink + knock letters at the same index so they move as one
          const ink = $$("#hook-ink .w" + n + " .ch");
          const kn = $$("#hook-knock .w" + n + " .ch");
          return ink.map((el, i) => [el, kn[i]]);
        };
        // Start state: only HOOK is in the line.
        [2, 3, 4].forEach((n) => tl.set(byIndex(n).flat(), { yPercent: 118 }, 0));
        tl.set(byIndex(1).flat(), { yPercent: 0 }, 0);
        tl.set("#hook-dot", { x: dotX[0], y: BASE - DOT, scaleX: 1, scaleY: 1, transformOrigin: "50% 100%" }, 0);

        // Slot rolls land on the beat: STORY fb2, MOTION fb4, SOUND fb6.
        [[1, 2, at(2)], [2, 3, at(4)], [3, 4, at(6)]].forEach(([from, to, T]) => {
          byIndex(from).forEach((pair, i) => {
            tl.fromTo(pair, { yPercent: 0 }, { yPercent: -118, duration: 0.09, ease: "power3.in" }, T - 0.12 + i * 0.033);
          });
          byIndex(to).forEach((pair, i) => {
            tl.fromTo(pair, { yPercent: 118 }, { yPercent: 0, duration: 0.1, ease: "power3.out" }, T - 0.1 + i * 0.033);
          });
          tl.fromTo("#hook-dot", { x: dotX[from - 1] }, { x: dotX[to - 1], duration: 0.24, ease: "expo.out" }, T - 0.04);
        });

        // Pickup hit fb7: the word blurs out, the dot leaps, then floods the frame cobalt on the drop.
        const T7 = at(7);
        tl.fromTo(byIndex(4).flat(), { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.13, ease: "power2.in", stagger: 0.012 }, T7);
        tl.fromTo("#hook-dot", { scaleX: 1, scaleY: 1 }, { scaleX: 1.28, scaleY: 0.7, duration: 0.07, ease: "power2.out" }, T7 - 0.07);
        tl.fromTo("#hook-dot", { x: dotX[3] }, { x: 960 - DOT / 2, duration: 0.36, ease: "power1.inOut" }, T7);
        tl.fromTo("#hook-dot", { y: BASE - DOT }, { y: 392 - DOT / 2, duration: 0.36, ease: "power3.out" }, T7);
        tl.fromTo("#hook-dot", { scaleX: 1.28, scaleY: 0.7 }, { scaleX: 0.82, scaleY: 1.26, duration: 0.09, ease: "power2.out" }, T7);
        tl.fromTo("#hook-dot", { scaleX: 0.82, scaleY: 1.26 }, { scaleX: 1, scaleY: 1, duration: 0.3, ease: "elastic.out(1, 0.55)" }, T7 + 0.09);
        tl.fromTo("#hook-flood", { clipPath: "circle(0px at 960px 392px)" }, { clipPath: "circle(2300px at 960px 392px)", duration: 0.2, ease: "power3.in" }, at(8) - 0.2);

        // Shapes: the coral circle hops on every beat; on each roll the others bounce, draw on or look around.
        [1, 2, 3, 4, 5, 6].map(at).forEach((b) => {
          tl.fromTo("#hs-circle", { y: 0 }, { y: -80, duration: 0.2, ease: "power2.out", immediateRender: false }, b);
          tl.to("#hs-circle", { y: 0, duration: 0.24, ease: "power2.in" }, b + 0.2);
          tl.fromTo("#hs-circle", { scaleY: 0.72, scaleX: 1.18, transformOrigin: "50% 100%" },
            { scaleY: 1, scaleX: 1, duration: 0.3, ease: "elastic.out(1, 0.45)", immediateRender: false }, b + 0.44);
        });
        const rolls = [at(2), at(4), at(6)];
        rolls.forEach((T, k) => {
          tl.to("#hs-half", { x: [-200, 130, -90][k], duration: 0.42, ease: "expo.out" }, T - 0.06);
          tl.fromTo("#hs-half", { scaleY: 0.78, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.45, ease: "elastic.out(1, 0.5)", immediateRender: false }, T - 0.02);
          tl.to("#hs-arcs", { clipPath: `circle(${[260, 310, 360][k]}px at 50% 50%)`, duration: 0.3, ease: "expo.out" }, T - 0.04);
          tl.fromTo("#hs-quarter", { scale: 1.14, transformOrigin: "0% 100%" }, { scale: 1, duration: 0.42, ease: "elastic.out(1, 0.5)", immediateRender: false }, T - 0.02);
          tl.fromTo("#hs-dome", { scaleY: 1.3, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.42, ease: "elastic.out(1, 0.5)", immediateRender: false }, T - 0.02);
          tl.to("#hs-pupil", { x: [-26, 26, 0][k], duration: 0.22, ease: "power3.out" }, T - 0.04);
        });
        tl.to("#hs-stripes", { clipPath: "inset(0 0 0 0%)", duration: 0.3, ease: "expo.out" }, rolls[0] - 0.04);
        tl.fromTo("#hs-stripes", { backgroundPositionY: "0px" }, { backgroundPositionY: "28px", duration: 0.25, ease: "power2.out", immediateRender: false }, rolls[1]);
        tl.to("#hs-stripes", { backgroundPositionY: "56px", duration: 0.25, ease: "power2.out" }, rolls[2]);
        tl.fromTo("#hs-eye", { scaleY: 1 }, { scaleY: 0.1, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1, immediateRender: false }, rolls[1] + 0.14);
        // On the pickup every shape leaves by its nearest edge.
        const T7s = at(7);
        tl.to("#hs-half", { y: -280, duration: 0.26, ease: "power3.in" }, T7s);
        tl.to("#hs-arcs", { scale: 0.2, opacity: 0, duration: 0.26, ease: "power3.in" }, T7s);
        tl.to("#hs-quarter", { x: -380, y: 380, duration: 0.28, ease: "power3.in" }, T7s);
        tl.to("#hs-circle", { y: 220, duration: 0.24, ease: "power3.in" }, T7s + 0.02);
        tl.to("#hs-dome", { y: 220, duration: 0.26, ease: "power3.in" }, T7s + 0.03);
        tl.to("#hs-eye", { x: 320, rotation: 90, duration: 0.28, ease: "power3.in" }, T7s + 0.01);
        tl.to("#hs-stripes", { x: 480, duration: 0.26, ease: "power3.in" }, T7s + 0.02);

        window.__timelines["hook"] = tl;
      }

      document.fonts.load(FONT).then(build, build);
    })();
  </script>
