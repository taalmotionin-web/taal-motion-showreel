<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: var(--color-ink);
    }
    #st-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }
    #st-flood {
      position: absolute;
      inset: 0;
      background: var(--color-cobalt);
      clip-path: circle(0px at 960px 540px);
    }
  </style>
  <div id="root" data-composition-id="stop" data-width="1920" data-height="1080" data-motion-blur="off">
    <canvas id="st-canvas" width="1920" height="1080"></canvas>
    <div id="st-flood"></div>
  </div>
  <script>
    (function () {
      const DUR = 2.1334;
      const clock = { t: 0 };
      const host = { render: null };
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      let ready;
      window.__hf.buildReady["stop"] = new Promise((r) => (ready = r));
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: DUR, duration: DUR, ease: "none", onUpdate: () => host.render && host.render(clock.t) });
      // The boom: the sphere floods the frame from the centre.
      tl.fromTo("#st-flood", { clipPath: "circle(230px at 960px 540px)" },
        { clipPath: "circle(2300px at 960px 540px)", duration: 0.2, ease: "power3.in", immediateRender: false }, DUR - 0.2);

      import("./assets/js/kit.js").then(async (K) => {
        const { THREE, scene, camera, render } = await K.stage(document.getElementById("st-canvas"), { bg: K.C.ink, z: 13 });
        const { clamp01, easeIn3, easeInOut, spring, lerp } = K;
        // The drums stop, so time stops: the objects hang frozen while the camera moves around them.
        const set = [
          ["quarter", K.C.coral, -3.4, 1.3, -1.0, 1.25], ["ring", K.C.saffron, 3.1, 1.6, 0.4, 1.1], ["sphere", K.C.bone, -1.5, -1.9, 1.3, 0.85],
          ["cone", K.C.coral, 3.6, -1.5, -0.8, 1.1], ["half", K.C.saffron, 0.3, 2.4, -2.2, 1.15], ["capsule", K.C.bone, -4.2, -0.4, 0.6, 1.0],
          ["arch", K.C.coral, 1.4, -2.6, -1.4, 1.1], ["stack", K.C.saffron, -0.9, 0.9, 2.4, 0.75],
        ];
        const objs = set.map(([k, col, x, y, z, s], i) => {
          const o = K.shape(THREE, k, col, K.C.bone);
          scene.add(o);
          return { o, x, y, z, s, rx: i * 0.9, ry: i * 1.7, w: 0.05 + 0.02 * (i % 3) };
        });
        const core = K.shape(THREE, "sphere", K.C.cobalt);
        scene.add(core);
        host.render = (t) => {
          // Camera: a slow orbit and dolly while everything is still.
          const p = easeInOut(t / 1.75);
          const a = lerp(-0.42, 0.3, p), R = lerp(13.5, 10.8, p);
          camera.position.set(Math.sin(a) * R, lerp(0.9, -0.3, p), Math.cos(a) * R);
          camera.lookAt(0, 0, 0);
          // Implode into the cobalt core in the silence before the boom.
          const pull = easeIn3((t - 1.42) / 0.45);
          objs.forEach((B) => {
            B.o.position.set(lerp(B.x, 0, pull), lerp(B.y, 0, pull), lerp(B.z, 0, pull));
            B.o.scale.setScalar(Math.max(0.001, 1.35 * B.s * (1 - pull)));
            B.o.rotation.set(B.rx + t * B.w + pull * 4, B.ry + t * B.w * 1.4 + pull * 6, 0);
          });
          const grow = spring(clamp01((t - 1.05) / 0.35)) * 0.55 + 0.75 * easeIn3((t - 1.42) / 0.45);
          const q = easeIn3((t - 1.86) / 0.16);
          core.scale.set(Math.max(0.001, grow * (1 + 0.12 * q)), Math.max(0.001, grow * (1 - 0.18 * q)), Math.max(0.001, grow * (1 + 0.12 * q)));
          core.visible = t >= 1.05;
          render();
        };
        host.render(clock.t);
        window.__timelines["stop"] = tl; // registered once the 3D is built
        ready();
      }).catch((err) => {
        console.error("[stop] 3D build failed", err);
        window.__timelines["stop"] = tl;
        ready();
      });
    })();
  </script>
</template>
