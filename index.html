<!doctype html>
<html
  lang="en"
  data-resolution="landscape"
  data-composition-variables='[
    {"id":"color-bone","type":"color","label":"Bone (ground)","default":"#F4F1EA"},
    {"id":"color-ink","type":"color","label":"Ink (text)","default":"#14161A"},
    {"id":"color-cobalt","type":"color","label":"Cobalt (sam accent)","default":"#2B4BFF"},
    {"id":"color-muted","type":"color","label":"Muted","default":"#6B6A66"},
    {"id":"font-display","type":"string","label":"Display font","default":"Inter"},
    {"id":"site","type":"string","label":"End card URL","default":"taalmotion.netlify.app"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Taal Motion showreel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter Tight";
        font-weight: 500;
        src: url("assets/fonts/InterTight-Medium.ttf");
      }
      :root {
        --color-bone: #f4f1ea;
        --color-ink: #14161a;
        --color-cobalt: #2b4bff;
        --color-muted: #6b6a66;
        --font-display: "Inter";
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--color-bone);
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        font-family: var(--font-display), sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main" data-fx-chain='{"version":1,"nodes":[{"type":"gain","id":"m1","label":"Loudness lift","params":{"gain":3}},{"type":"truepeak","id":"m2","label":"Delivery ceiling","params":{"ceiling":-1.5,"lookahead":3,"release":80}}]}'
      data-start="0"
      data-duration="47.5"
      data-width="1920"
      data-height="1080"
      data-motion-blur="on"
    >
      <!-- Scenes: one 16-beat teentaal cycle per chapter; boundaries sit on beat frames (114 BPM, fb x 15.79 frames). -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="launch" data-composition-id="launch" data-composition-src="compositions/launch.html" data-start="4.2" data-duration="4.2333" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="launch3d" data-composition-id="launch3d" data-composition-src="compositions/launch3d.html" data-start="4.2" data-duration="4.2333" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="apps" data-composition-id="apps" data-composition-src="compositions/apps.html" data-start="8.4333" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="threed" data-composition-id="threed" data-composition-src="compositions/threed.html" data-start="12.6333" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="features" data-composition-id="features" data-composition-src="compositions/features.html" data-start="16.8333" data-duration="2.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="stop" data-composition-id="stop" data-composition-src="compositions/stop.html" data-start="18.9333" data-duration="2.1334" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="formats" data-composition-id="formats" data-composition-src="compositions/formats.html" data-start="21.0667" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="type" data-composition-id="type" data-composition-src="compositions/type.html" data-start="25.2667" data-duration="4.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="motion" data-composition-id="motion" data-composition-src="compositions/motion.html" data-start="29.4667" data-duration="8.4333" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="wall" data-composition-id="wall" data-composition-src="compositions/wall.html" data-start="37.9" data-duration="5.2667" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="taal" data-composition-id="taal" data-composition-src="compositions/taal.html" data-start="43.1667" data-duration="1.8333" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="45" data-duration="2.5" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- Music: the user's track, cut to 46.33 s (see BRIEF.md for source ranges). -->
      <audio id="music" src="assets/audio/funk-edit.wav" data-start="0" data-duration="46.33" data-track-index="10" data-volume="0.78"></audio>

      <!-- Effects: each placed so its peak lands one frame after its picture. -->
      <audio id="sfx-key-1" src="assets/audio/sfx/sfx-key.wav" data-start="1.082" data-duration="0.1" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-key-2" src="assets/audio/sfx/sfx-key.wav" data-start="2.115" data-duration="0.1" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-key-3" src="assets/audio/sfx/sfx-key.wav" data-start="3.182" data-duration="0.1" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-leap" src="assets/audio/sfx/sfx-swish.wav" data-start="3.671" data-duration="0.383" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-band" src="assets/audio/sfx/sfx-whoosh-soft.wav" data-start="4.748" data-duration="1.3" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-launch-1" src="assets/audio/sfx/sfx-whoosh-b.wav" data-start="5.815" data-duration="1.2" data-track-index="15" data-volume="0.35"></audio>
      <audio id="sfx-launch-2" src="assets/audio/sfx/sfx-whoosh-soft.wav" data-start="6.848" data-duration="1.3" data-track-index="16" data-volume="0.3"></audio>
      <audio id="sfx-rows-out" src="assets/audio/sfx/sfx-swish-b.wav" data-start="7.871" data-duration="0.33" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-tile-1" src="assets/audio/sfx/sfx-pop.wav" data-start="9.755" data-duration="0.589" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-tile-2" src="assets/audio/sfx/sfx-pop-b.wav" data-start="10.289" data-duration="0.53" data-track-index="11" data-volume="0.35"></audio>
      <audio id="sfx-can-strip" src="assets/audio/sfx/sfx-whoosh-b.wav" data-start="14.748" data-duration="1.2" data-track-index="12" data-volume="0.4"></audio>
      <audio id="sfx-flythrough" src="assets/audio/sfx/sfx-swish-c.wav" data-start="16.538" data-duration="0.43" data-track-index="14" data-volume="0.5"></audio>
      <audio id="sfx-export-click" src="assets/audio/sfx/sfx-click.wav" data-start="17.905" data-duration="0.13" data-track-index="11" data-volume="0.55"></audio>
      <audio id="sfx-grid-1" src="assets/audio/sfx/sfx-pop.wav" data-start="35.822" data-duration="0.589" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-grid-2" src="assets/audio/sfx/sfx-pop-b.wav" data-start="36.355" data-duration="0.53" data-track-index="14" data-volume="0.3"></audio>
      <audio id="sfx-grid-3" src="assets/audio/sfx/sfx-pop.wav" data-start="37.389" data-duration="0.589" data-track-index="11" data-volume="0.3"></audio>
      <audio id="sfx-morph-1" src="assets/audio/sfx/sfx-swish.wav" data-start="23.138" data-duration="0.383" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-morph-2" src="assets/audio/sfx/sfx-swish-b.wav" data-start="24.171" data-duration="0.33" data-track-index="12" data-volume="0.45"></audio>
      <audio id="sfx-slam-1" src="assets/audio/sfx/sfx-swish-c.wav" data-start="25.238" data-duration="0.43" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-slam-2" src="assets/audio/sfx/sfx-swish.wav" data-start="26.271" data-duration="0.383" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-slam-3" src="assets/audio/sfx/sfx-swish-b.wav" data-start="27.338" data-duration="0.33" data-track-index="12" data-volume="0.5"></audio>
      <audio id="sfx-riser" src="assets/audio/sfx/sfx-riser.wav" data-start="43.791" data-duration="1.264" data-track-index="13" data-volume="0.45"></audio>
      <audio id="sfx-impact" src="assets/audio/sfx/sfx-impact.wav" data-start="45.011" data-duration="0.913" data-track-index="14" data-volume="0.7"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
